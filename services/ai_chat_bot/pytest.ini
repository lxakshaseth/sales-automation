[pytest]
testpaths = tests
python_files = test_*.py
asyncio_mode = auto
addopts = -ra --strict-markers --strict-config --cov=app --cov-report=term-missing --cov-report=xml
markers =
    unit: fast unit tests
    integration: integration tests with mocked infrastructure
    performance: performance and latency tests
    load: locust/load-test related checks
    slow: tests that may take longer than normal unit tests
filterwarnings =
    ignore::DeprecationWarning

