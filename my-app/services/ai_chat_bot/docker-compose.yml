services:
  app:
    container_name: ai_chat_bot_app
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Containers must use the Compose service name, not localhost, to reach Redis.
      REDIS_URL: redis://redis:6379/0
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-twilio}
    ports:
      - "8000:8000"
    volumes:
      # Development hot reload: source edits on the host are reflected in the container.
      - ./app:/app/app
      - ./data:/app/data
      - ./logs:/app/logs
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    container_name: ai_chat_bot_redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  celery_worker:
    container_name: ai_chat_bot_celery_worker
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-twilio}
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./logs:/app/logs
    command: celery -A app.workers.celery_app worker --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery_beat:
    container_name: ai_chat_bot_celery_beat
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-twilio}
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./logs:/app/logs
    command: celery -A app.workers.celery_app beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
